name: Publish alpha

on:
  push:
    branches-ignore:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vitest
      - run: npm run build
        env:
          RELEASE_CHANNEL: alpha
      - name: Calculate alpha version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name' |
              sed -nE 's/^v0\.0\.([0-9]+)-alpha$/\1/p' |
              sort -n | tail -n 1
          )"
          latest="${latest:-0}"
          echo "tag=v0.0.$((latest + 1))-alpha" >> "$GITHUB_OUTPUT"
      - name: Package source code
        run: git archive --format=tar.gz --prefix=it-step-auto-grader-${GITHUB_SHA}/ "$GITHUB_SHA" -o dist/it-step-auto-grader-source-alpha.tar.gz
      - name: Package unpacked extension download
        run: |
          (cd dist/it-step-auto-grader-extension && zip -q -r ../it-step-auto-grader-extension-alpha-unpacked.zip .)
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: it-step-auto-grader-extension-alpha-unpacked
          path: dist/it-step-auto-grader-extension/
          if-no-files-found: error
          retention-days: 14
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/it-step-auto-grader-extension-alpha.zip \
            dist/it-step-auto-grader-extension-alpha-unpacked.zip \
            dist/it-step-auto-grader-source-alpha.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "IT Step Auto Grader $RELEASE_TAG" \
            --generate-notes
