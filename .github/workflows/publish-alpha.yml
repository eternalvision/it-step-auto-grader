name: Publish alpha

on:
  push:
    branches-ignore:
      - main
      - dev

permissions:
  contents: write

concurrency:
  group: publish-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vitest
      - run: npm run build
        env:
          RELEASE_CHANNEL: alpha
      - name: Package source code
        run: git archive --format=tar.gz --prefix=it-step-auto-grader-${GITHUB_SHA}/ "$GITHUB_SHA" -o dist/it-step-auto-grader-source-alpha.tar.gz
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.0-alpha.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/it-step-auto-grader-extension-alpha.zip \
            dist/it-step-auto-grader-source-alpha.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "IT Step Auto Grader $RELEASE_TAG" \
            --generate-notes
