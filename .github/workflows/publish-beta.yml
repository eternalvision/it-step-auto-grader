name: Publish beta

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vitest
      - run: npm run build
        env:
          RELEASE_CHANNEL: beta
      - name: Package source code
        run: git archive --format=tar.gz --prefix=it-step-auto-grader-${GITHUB_SHA}/ "$GITHUB_SHA" -o dist/it-step-auto-grader-source-beta.tar.gz
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: it-step-auto-grader-extension-beta-unpacked
          path: dist/it-step-auto-grader-extension/
          if-no-files-found: error
          retention-days: 14
      - name: Calculate beta version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            parents="$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)"
            if [ "$parents" -lt 3 ]; then
              echo "Direct dev push is not a release event; only merge commits publish beta"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          alpha_tag="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[].name' |
            grep -E '^v0\.0\.[0-9]+-alpha$' |
            sort -V | tail -n 1 || true)"
          if [ -z "$alpha_tag" ]; then
            echo "No alpha release tag exists to promote to beta"
            exit 1
          fi
          patch="${alpha_tag#v0.0.}"
          patch="${patch%-alpha}"
          beta_minor="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name' |
              sed -nE "s/^v0\.([0-9]+)\.${patch}-beta$/\1/p" |
              sort -n | tail -n 1
          )"
          beta_minor="${beta_minor:-0}"
          beta_minor=$((beta_minor + 1))
          echo "tag=v0.${beta_minor}.${patch}-beta" >> "$GITHUB_OUTPUT"
      - name: Publish beta release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/it-step-auto-grader-extension-beta.zip \
            dist/it-step-auto-grader-source-beta.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "IT Step Auto Grader $RELEASE_TAG" \
            --generate-notes
