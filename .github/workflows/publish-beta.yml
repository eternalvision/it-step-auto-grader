name: Publish beta

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vitest
      - run: npm run build
        env:
          RELEASE_CHANNEL: beta
      - name: Package source code
        run: git archive --format=tar.gz --prefix=it-step-auto-grader-${GITHUB_SHA}/ "$GITHUB_SHA" -o dist/it-step-auto-grader-source-beta.tar.gz
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: it-step-auto-grader-extension-beta-unpacked
          path: dist/it-step-auto-grader-extension/
          if-no-files-found: error
          retention-days: 14
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.0-beta.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/it-step-auto-grader-extension-beta.zip \
            dist/it-step-auto-grader-source-beta.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "IT Step Auto Grader $RELEASE_TAG" \
            --generate-notes
