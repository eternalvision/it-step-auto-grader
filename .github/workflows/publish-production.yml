name: Publish production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vitest
      - run: npm run build
        env:
          RELEASE_CHANNEL: production
      - name: Publish production release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Production tags must use vMAJOR.MINOR.PATCH: $RELEASE_TAG"
            exit 1
          fi
          case "$RELEASE_TAG" in
            *-alpha.*|*-beta.*)
              echo "Production tags cannot have alpha/beta suffixes: $RELEASE_TAG"
              exit 1
              ;;
          esac
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Production tags must point to a commit contained in main"
            exit 1
          fi
          mv dist/it-step-auto-grader-extension-production.zip \
            "dist/it-step-auto-grader-extension-${RELEASE_TAG}.zip"
          git archive --format=tar.gz --prefix=it-step-auto-grader-${RELEASE_TAG}/ "$GITHUB_SHA" \
            -o "dist/it-step-auto-grader-source-${RELEASE_TAG}.tar.gz"
          gh release create "$RELEASE_TAG" \
            "dist/it-step-auto-grader-extension-${RELEASE_TAG}.zip" \
            "dist/it-step-auto-grader-source-${RELEASE_TAG}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --title "IT Step Auto Grader $RELEASE_TAG" \
            --generate-notes
