name: Publish production

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:vitest
      - run: npm run build
        env:
          RELEASE_CHANNEL: production
      - name: Calculate production version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          beta_tag="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta$' |
            while read -r tag; do
              commit="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
              if [ -n "$commit" ] && git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
                printf '%s\n' "$tag"
              fi
            done |
            sort -V | tail -n 1 || true)"
          if [ -z "$beta_tag" ]; then
            echo "No beta tag from dev is contained in main"
            exit 1
          fi
          stable_tag="$(printf '%s\n' "$beta_tag" | sed -E 's/^v[0-9]+\.([0-9]+)\.([0-9]+)-beta$/v1.\1.\2/')"
          echo "tag=$stable_tag" >> "$GITHUB_OUTPUT"
      - name: Publish production release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mv dist/it-step-auto-grader-extension-production.zip \
            "dist/it-step-auto-grader-extension-${RELEASE_TAG}.zip"
          git archive --format=tar.gz --prefix=it-step-auto-grader-${RELEASE_TAG}/ "$GITHUB_SHA" \
            -o "dist/it-step-auto-grader-source-${RELEASE_TAG}.tar.gz"
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: it-step-auto-grader-extension-${{ steps.version.outputs.tag }}-unpacked
          path: dist/it-step-auto-grader-extension/
          if-no-files-found: error
          retention-days: 30
      - name: Publish production release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/it-step-auto-grader-extension-${RELEASE_TAG}.zip" \
            "dist/it-step-auto-grader-source-${RELEASE_TAG}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "IT Step Auto Grader $RELEASE_TAG" \
            --generate-notes
